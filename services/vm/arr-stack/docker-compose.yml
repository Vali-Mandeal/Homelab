services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${VPN_WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES}
      - VPN_PORT_FORWARDING=on
      - TZ=${TZ}
    ports:
      # qBittorrent ports (exposed here because qBit shares Gluetun's network)
      - "8080:8080"    # qBittorrent WebUI
      - "50413:50413"  # TCP
      - "50413:50413/udp"  # UDP
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.1.4
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${DB_QBITTORRENT}:/config
      - ${DL_INCOMPLETE}:/downloads/incomplete
      - ${DL_COMPLETE}:/downloads/complete
      - ${MUSIC_DIR}:/music
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.0.5236-ls137
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DB_PROWLARR}:/config
    ports:
      - "9696:9696"
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9696/" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.0.4.10291-ls292
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DB_RADARR}:/config
      - ${MOVIES_DIR}:/movies
      - ${DL_COMPLETE}:/downloads/complete
    ports:
      - "7878:7878"
    depends_on:
      prowlarr:
        condition: service_started
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7878/" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.16.2944-ls302
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${DB_SONARR}:/config
      - ${SERIES_DIR}:/series
      - ${DL_COMPLETE}:/downloads/complete
    ports:
      - "8989:8989"
    depends_on:
      prowlarr:
        condition: service_started
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:2.7.3
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - ${DB_JELLYSEERR}:/app/config
    ports:
      - "${JELLYSEERR_PORT}:5055"
    depends_on:
      radarr:
        condition: service_started
      sonarr:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/status" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped
