services:
  db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    command: postgres -c max_connections=200
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${DB_POSTGRES}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d nextcloud"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${DB_REDIS}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 60s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: nextcloud-onlyoffice
    environment:
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - JWT_HEADER=AuthorizationJwt
      - JWT_IN_BODY=true
    ports:
      - "9980:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    environment:
      # DB credentials are NOT passed here - they trigger the entrypoint's
      # auto-install which races with our occ maintenance:install in bootstrap.sh.
      # The bootstrap handles installation and full configuration via occ.
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=${NEXTCLOUD_URL}
      - APACHE_BODY_LIMIT=0
    volumes:
      - ${DB_NEXTCLOUD}:/var/www/html
      - ${MOUNT_PERSONAL}:/mnt/personal:rw
      - ${MOUNT_SHARED}:/mnt/shared:rw
      - ${DATA_DIR}:/var/www/html/data:rw
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/status.php"]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
