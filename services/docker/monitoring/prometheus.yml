global:
  scrape_interval: 300s
  evaluation_interval: 600s  # Alert rules evaluate every 10m - halves Prometheus CPU vs 300s

# All hosts push metrics via Alloy remote_write.
# The --web.enable-remote-write-receiver flag accepts incoming data.
#
# If public VLAN firewall blocks outbound to private network in the future,
# switch public hosts to pull model: uncomment the scrape_configs below
# and reconfigure their Alloy agents to expose metrics instead of pushing.
